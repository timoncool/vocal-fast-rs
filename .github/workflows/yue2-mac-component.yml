name: YuE2 macOS arm64 RVC component

on:
  push:
    branches: [yue2/portable-cpu-runtime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: uxlfoundation/oneDNN
          ref: f1d471933dc852f956fd05389f9313c7148783d5
          path: .build/onednn-source
      - name: Build arm64 runtime and CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          export VOCAL_CPU_ONEDNN_ROOT="$RUNNER_TEMP/onednn"
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cmake -S .build/onednn-source -B "$RUNNER_TEMP/dnnl-build"             -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$VOCAL_CPU_ONEDNN_ROOT"             -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_NAME_DIR=@rpath             -DDNNL_CPU_RUNTIME=THREADPOOL -DDNNL_GPU_RUNTIME=NONE -DONEDNN_BUILD_GRAPH=OFF             -DDNNL_BUILD_TESTS=OFF -DDNNL_BUILD_EXAMPLES=OFF -DDNNL_ENABLE_WORKLOAD=INFERENCE
          cmake --build "$RUNNER_TEMP/dnnl-build" --config Release --parallel "$(sysctl -n hw.logicalcpu)"
          cmake --install "$RUNNER_TEMP/dnnl-build"
          cargo build --release --locked -p vocal-fast --features cpu-graph
          dest="$RUNNER_TEMP/rvc-component"
          mkdir -p "$dest/licenses"
          cp LICENSE "$dest/licenses/vocal-fast-rs-LICENSE"
          cp .build/onednn-source/LICENSE "$dest/licenses/oneDNN-LICENSE"
          cp .build/onednn-source/THIRD-PARTY-PROGRAMS "$dest/licenses/oneDNN-THIRD-PARTY-PROGRAMS"
          cp target/release/vocal-fast "$dest"
          cp -a "$VOCAL_CPU_ONEDNN_ROOT"/lib/libdnnl*.dylib "$dest/"
          check="$GITHUB_WORKSPACE/scripts/check-yue2-macos-component.sh"
          bash "$check" prepare "$dest"
          cd "$dest"
          env -u DYLD_LIBRARY_PATH ./vocal-fast --help
          archive="$RUNNER_TEMP/vocal-fast-macos-arm64-cpu.tar.gz"
          tar -czf "$archive" .
          relocated="$RUNNER_TEMP/Музыкальная студия/RVC"
          mkdir -p "$relocated"
          tar -xzf "$archive" -C "$relocated"
          cd "$relocated"
          bash "$check" verify "$relocated"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH ./vocal-fast --help
      - uses: actions/upload-artifact@v4
        with:
          name: vocal-fast-macos-arm64-cpu
          path: ${{ runner.temp }}/vocal-fast-macos-arm64-cpu.tar.gz
